<div class="vh-100 d-flex justify-content-center align-items-center bg-light">
  <div class="card shadow border-0 rounded-4" style="width: 400px;">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <h2 class="fw-bold text-dark mb-1">Hotel Management</h2>
        <p class="text-muted">Sign in to your account</p>
      </div>

      <div *ngIf="error" class="alert alert-danger py-2 fs-6 mb-4">
        {{ error }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label text-muted fw-semibold">Email address</label>
          <input type="email" formControlName="email" class="form-control form-control-lg bg-light" [ngClass]="{ 'is-invalid': submitted && f['email'].errors }" placeholder="name@example.com">
          <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
            <div *ngIf="f['email'].errors['required']">Email is required</div>
            <div *ngIf="f['email'].errors['email']">Email must be a valid email address</div>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label text-muted fw-semibold">Password</label>
          <input type="password" formControlName="password" class="form-control form-control-lg bg-light" [ngClass]="{ 'is-invalid': submitted && f['password'].errors }" placeholder="••••••••">
          <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
            <div *ngIf="f['password'].errors['required']">Password is required</div>
          </div>
        </div>

        <button [disabled]="loading" class="btn btn-primary-custom w-100 btn-lg rounded-3 fw-semibold">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          Sign In
        </button>
      </form>
    </div>
  </div>
</div>
