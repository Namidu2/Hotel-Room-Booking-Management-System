<div class="container-fluid py-2">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="h3 mb-0 text-dark fw-bold">Room Types</h2>
    <a routerLink="/room-types/add" class="btn btn-primary-custom">
      <i class="bi bi-plus-lg me-1"></i> Add Room Type
    </a>
  </div>

  <div class="card border-0 shadow-sm rounded-3">
    <div class="card-body p-4">

      <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary-custom" role="status"></div>
      </div>

      <div *ngIf="!loading && roomTypes.length === 0" class="text-center py-5 bg-light rounded">
        <i class="bi bi-door-closed text-muted" style="font-size: 3rem;"></i>
        <h5 class="mt-3 text-dark">No Room Types found</h5>
        <a routerLink="/room-types/add" class="btn btn-primary-custom mt-3">Add Room Type</a>
      </div>

      <div class="table-responsive" *ngIf="!loading && roomTypes.length > 0">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light text-muted">
            <tr>
              <th scope="col" class="fw-semibold">ID</th>
              <th scope="col" class="fw-semibold">Name</th>
              <th scope="col" class="fw-semibold">Capacity</th>
              <th scope="col" class="fw-semibold">Price / Night</th>
              <th scope="col" class="fw-semibold text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let rt of roomTypes">
              <td><span class="text-muted">#{{ rt.room_type_id | number:'2.0' }}</span></td>
              <td class="fw-medium text-dark">{{ rt.type_name }}</td>
              <td><i class="bi bi-person-fill text-muted me-1"></i>{{ rt.capacity }}</td>
              <td class="fw-medium text-success">${{ rt.price_per_night }}</td>
              <td class="text-end">
                <a [routerLink]="['/room-types/edit', rt.room_type_id]" class="btn btn-sm btn-light text-primary me-2">
                  <i class="bi bi-pencil"></i> Edit
                </a>
                <button (click)="deleteRoomType(rt.room_type_id!)" class="btn btn-sm btn-light text-danger">
                  <i class="bi bi-trash"></i> Delete
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
    </div>
  </div>
</div>
