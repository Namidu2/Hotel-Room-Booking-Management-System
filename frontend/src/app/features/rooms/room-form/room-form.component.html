<div class="container-fluid py-2">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="h3 mb-0 text-dark fw-bold">{{ isEditMode ? 'Edit Room' : 'Add Room' }}</h2>
    <a routerLink="/rooms" class="btn btn-light border">
      <i class="bi bi-arrow-left me-1"></i> Back to List
    </a>
  </div>

  <div class="card border-0 shadow-sm rounded-3" style="max-width: 800px;">
    <div class="card-body p-4 p-md-5">
      
      <div *ngIf="error" class="alert alert-danger mb-4">
        {{ error }}
      </div>
      
      <div *ngIf="loading && isEditMode" class="text-center py-5">
        <div class="spinner-border text-primary-custom" role="status"></div>
      </div>

      <form *ngIf="!loading || !isEditMode" [formGroup]="roomForm" (ngSubmit)="onSubmit()">
        
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted">Room Number <span class="text-danger">*</span></label>
            <input type="text" formControlName="room_number" class="form-control bg-light" [ngClass]="{ 'is-invalid': submitted && f['room_number'].errors }" placeholder="e.g. 101">
            <div *ngIf="submitted && f['room_number'].errors" class="invalid-feedback">Room number is required</div>
          </div>
          
          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted">Floor</label>
            <input type="text" formControlName="floor" class="form-control bg-light" placeholder="e.g. 1st Floor">
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted">Room Type <span class="text-danger">*</span></label>
            <select formControlName="room_type_id" class="form-select bg-light" [ngClass]="{ 'is-invalid': submitted && f['room_type_id'].errors }">
              <option value="" disabled>Select Room Type</option>
              <option *ngFor="let type of roomTypes" [value]="type.room_type_id">
                {{ type.type_name }} ({{ type.capacity }} guests)
              </option>
            </select>
            <div *ngIf="submitted && f['room_type_id'].errors" class="invalid-feedback">Room type is required</div>
          </div>
          
          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted">Status <span class="text-danger">*</span></label>
            <select formControlName="status" class="form-select bg-light" [ngClass]="{ 'is-invalid': submitted && f['status'].errors }">
              <option *ngFor="let stat of statuses" [value]="stat">{{ stat }}</option>
            </select>
            <div *ngIf="submitted && f['status'].errors" class="invalid-feedback">Status is required</div>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 border-top pt-4">
          <a routerLink="/rooms" class="btn btn-light px-4">Cancel</a>
          <button type="submit" [disabled]="loading" class="btn btn-primary-custom px-4">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
            {{ isEditMode ? 'Save Changes' : 'Create Room' }}
          </button>
        </div>
      </form>
      
    </div>
  </div>
</div>
