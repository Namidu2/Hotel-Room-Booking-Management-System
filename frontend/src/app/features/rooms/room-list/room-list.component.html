<div class="container-fluid py-2">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="h3 mb-0 text-dark fw-bold">Rooms</h2>
    <a routerLink="/rooms/add" class="btn btn-primary-custom">
      <i class="bi bi-plus-lg me-1"></i> Add Room
    </a>
  </div>

  <div class="card border-0 shadow-sm rounded-3">
    <div class="card-body p-4">

      <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary-custom" role="status"></div>
      </div>

      <div *ngIf="!loading && rooms.length === 0" class="text-center py-5 bg-light rounded">
        <i class="bi bi-key text-muted" style="font-size: 3rem;"></i>
        <h5 class="mt-3 text-dark">No Rooms found</h5>
        <a routerLink="/rooms/add" class="btn btn-primary-custom mt-3">Add Room</a>
      </div>

      <div class="table-responsive" *ngIf="!loading && rooms.length > 0">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light text-muted">
            <tr>
              <th scope="col" class="fw-semibold">Room Number</th>
              <th scope="col" class="fw-semibold">Type</th>
              <th scope="col" class="fw-semibold">Floor</th>
              <th scope="col" class="fw-semibold">Status</th>
              <th scope="col" class="fw-semibold text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let room of rooms">
              <td class="fw-bold text-dark">{{ room.room_number }}</td>
              <td>{{ room.room_type?.type_name }}</td>
              <td>{{ room.floor || '-' }}</td>
              <td>
                <span class="badge rounded-pill" [ngClass]="getStatusBadgeClass(room.status)">
                  {{ room.status }}
                </span>
              </td>
              <td class="text-end">
                <a [routerLink]="['/rooms/edit', room.room_id]" class="btn btn-sm btn-light text-primary me-2">
                  <i class="bi bi-pencil"></i> Edit
                </a>
                <button (click)="deleteRoom(room.room_id!)" class="btn btn-sm btn-light text-danger">
                  <i class="bi bi-trash"></i> Delete
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
    </div>
  </div>
</div>
