<div class="container-fluid py-2">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="h3 mb-0 text-dark fw-bold">{{ isEditMode ? 'Edit Booking' : 'Add Booking' }}</h2>
    <a routerLink="/bookings" class="btn btn-light border">
      <i class="bi bi-arrow-left me-1"></i> Back to List
    </a>
  </div>

  <div class="card border-0 shadow-sm rounded-3" style="max-width: 800px;">
    <div class="card-body p-4 p-md-5">
      
      <div *ngIf="error" class="alert alert-danger mb-4">
        {{ error }}
      </div>
      
      <div *ngIf="loading && isEditMode" class="text-center py-5">
        <div class="spinner-border text-primary-custom" role="status"></div>
      </div>

      <form *ngIf="!loading || !isEditMode" [formGroup]="bookingForm" (ngSubmit)="onSubmit()">
        
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted">Customer <span class="text-danger">*</span></label>
            <select formControlName="customer_id" class="form-select bg-light" [ngClass]="{ 'is-invalid': submitted && f['customer_id'].errors }">
              <option value="" disabled>Select Customer</option>
              <option *ngFor="let c of customers" [value]="c.customer_id">
                {{ c.first_name }} {{ c.last_name }} ({{ c.email }})
              </option>
            </select>
            <div *ngIf="submitted && f['customer_id'].errors" class="invalid-feedback">Customer is required</div>
          </div>
          
          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted">Room <span class="text-danger">*</span></label>
            <select formControlName="room_id" class="form-select bg-light" [ngClass]="{ 'is-invalid': submitted && f['room_id'].errors }">
              <option value="" disabled>Select Room</option>
              <option *ngFor="let r of rooms" [value]="r.room_id">
                Room {{ r.room_number }} - {{ r.room_type?.type_name }} ({{ r.room_type?.capacity }} guests)
              </option>
            </select>
            <div *ngIf="submitted && f['room_id'].errors" class="invalid-feedback">Room is required</div>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted">Check-In Date <span class="text-danger">*</span></label>
            <input type="date" formControlName="check_in_date" class="form-control bg-light" [ngClass]="{ 'is-invalid': submitted && f['check_in_date'].errors }">
            <div *ngIf="submitted && f['check_in_date'].errors" class="invalid-feedback">Check-in date is required</div>
          </div>
          
          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted">Check-Out Date <span class="text-danger">*</span></label>
            <input type="date" formControlName="check_out_date" class="form-control bg-light" [ngClass]="{ 'is-invalid': submitted && f['check_out_date'].errors }">
            <div *ngIf="submitted && f['check_out_date'].errors" class="invalid-feedback">Check-out date is required</div>
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted">Number of Guests <span class="text-danger">*</span></label>
            <input type="number" formControlName="number_of_guests" class="form-control bg-light" [ngClass]="{ 'is-invalid': submitted && f['number_of_guests'].errors }">
            <div *ngIf="submitted && f['number_of_guests'].errors" class="invalid-feedback">Valid number of guests required</div>
          </div>
          
          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted">Booking Status <span class="text-danger">*</span></label>
            <select formControlName="booking_status" class="form-select bg-light" [ngClass]="{ 'is-invalid': submitted && f['booking_status'].errors }">
              <option *ngFor="let stat of statuses" [value]="stat">{{ stat }}</option>
            </select>
            <div *ngIf="submitted && f['booking_status'].errors" class="invalid-feedback">Status is required</div>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 border-top pt-4">
          <a routerLink="/bookings" class="btn btn-light px-4">Cancel</a>
          <button type="submit" [disabled]="loading" class="btn btn-primary-custom px-4">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
            {{ isEditMode ? 'Save Changes' : 'Create Booking' }}
          </button>
        </div>
      </form>
      
    </div>
  </div>
</div>
