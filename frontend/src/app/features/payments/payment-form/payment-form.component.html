<div class="container-fluid py-2">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="h3 mb-0 text-dark fw-bold">{{ isEditMode ? 'Edit Payment' : 'Add Payment' }}</h2>
    <a routerLink="/payments" class="btn btn-light border">
      <i class="bi bi-arrow-left me-1"></i> Back to List
    </a>
  </div>

  <div class="card border-0 shadow-sm rounded-3" style="max-width: 800px;">
    <div class="card-body p-4 p-md-5">
      
      <div *ngIf="error" class="alert alert-danger mb-4">
        {{ error }}
      </div>
      
      <div *ngIf="loading && isEditMode" class="text-center py-5">
        <div class="spinner-border text-primary-custom" role="status"></div>
      </div>

      <form *ngIf="!loading || !isEditMode" [formGroup]="paymentForm" (ngSubmit)="onSubmit()">
        
        <div class="row g-3 mb-3">
          <div class="col-md-12">
            <label class="form-label fw-semibold text-muted">Booking <span class="text-danger">*</span></label>
            <select formControlName="booking_id" class="form-select bg-light" (change)="onBookingChange()" [ngClass]="{ 'is-invalid': submitted && f['booking_id'].errors }">
              <option value="" disabled>Select Booking</option>
              <option *ngFor="let b of bookings" [value]="b.booking_id">
                Booking #{{ b.booking_id }} - {{ b.customer?.first_name }} {{ b.customer?.last_name }} - {{ b.check_in_date | date:'shortDate' }} to {{ b.check_out_date | date:'shortDate' }} (${{ b.total_amount }})
              </option>
            </select>
            <div *ngIf="submitted && f['booking_id'].errors" class="invalid-feedback">Booking is required</div>
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <label class="form-label fw-semibold text-muted">Amount ($) <span class="text-danger">*</span></label>
            <input type="number" step="0.01" formControlName="amount" class="form-control bg-light" [ngClass]="{ 'is-invalid': submitted && f['amount'].errors }">
            <div *ngIf="submitted && f['amount'].errors" class="invalid-feedback">Valid amount is required</div>
          </div>
          
          <div class="col-md-4">
            <label class="form-label fw-semibold text-muted">Payment Method <span class="text-danger">*</span></label>
            <select formControlName="payment_method" class="form-select bg-light" [ngClass]="{ 'is-invalid': submitted && f['payment_method'].errors }">
              <option *ngFor="let method of paymentMethods" [value]="method">{{ method }}</option>
            </select>
            <div *ngIf="submitted && f['payment_method'].errors" class="invalid-feedback">Payment method is required</div>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold text-muted">Status <span class="text-danger">*</span></label>
            <select formControlName="payment_status" class="form-select bg-light" [ngClass]="{ 'is-invalid': submitted && f['payment_status'].errors }">
              <option *ngFor="let stat of paymentStatuses" [value]="stat">{{ stat }}</option>
            </select>
            <div *ngIf="submitted && f['payment_status'].errors" class="invalid-feedback">Status is required</div>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 border-top pt-4">
          <a routerLink="/payments" class="btn btn-light px-4">Cancel</a>
          <button type="submit" [disabled]="loading" class="btn btn-primary-custom px-4">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
            {{ isEditMode ? 'Save Changes' : 'Process Payment' }}
          </button>
        </div>
      </form>
      
    </div>
  </div>
</div>
