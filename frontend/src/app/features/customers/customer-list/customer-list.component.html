<div class="container-fluid py-2">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="h3 mb-0 text-dark fw-bold">Customers</h2>
    <a routerLink="/customers/add" class="btn btn-primary-custom">
      <i class="bi bi-plus-lg me-1"></i> Add Customer
    </a>
  </div>

  <div class="card border-0 shadow-sm rounded-3">
    <div class="card-body p-4">
      <div class="row mb-4">
        <div class="col-md-4">
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control bg-light border-start-0" placeholder="Search customers..." [(ngModel)]="searchTerm" (input)="filterCustomers()">
          </div>
        </div>
      </div>

      <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary-custom" role="status"></div>
        <p class="mt-2 text-muted">Loading customers...</p>
      </div>

      <div *ngIf="!loading && filteredCustomers.length === 0" class="text-center py-5 bg-light rounded">
        <i class="bi bi-people text-muted" style="font-size: 3rem;"></i>
        <h5 class="mt-3 text-dark">No customers found</h5>
        <p class="text-muted mb-0">There are currently no customers to display.</p>
        <a routerLink="/customers/add" class="btn btn-primary-custom mt-3">Add Customer</a>
      </div>

      <div class="table-responsive" *ngIf="!loading && filteredCustomers.length > 0">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light text-muted">
            <tr>
              <th scope="col" class="fw-semibold">ID</th>
              <th scope="col" class="fw-semibold">Name</th>
              <th scope="col" class="fw-semibold">Email</th>
              <th scope="col" class="fw-semibold">Phone</th>
              <th scope="col" class="fw-semibold text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let customer of filteredCustomers">
              <td><span class="text-muted">#{{ customer.customer_id | number:'2.0' }}</span></td>
              <td class="fw-medium text-dark">{{ customer.first_name }} {{ customer.last_name }}</td>
              <td>{{ customer.email }}</td>
              <td>{{ customer.phone }}</td>
              <td class="text-end">
                <a [routerLink]="['/customers/edit', customer.customer_id]" class="btn btn-sm btn-light text-primary me-2">
                  <i class="bi bi-pencil"></i> Edit
                </a>
                <button (click)="deleteCustomer(customer.customer_id!)" class="btn btn-sm btn-light text-danger">
                  <i class="bi bi-trash"></i> Delete
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
    </div>
  </div>
</div>
